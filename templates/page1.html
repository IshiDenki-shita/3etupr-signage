<!DOCTYPE html>
<!-- HTML5であることを宣言 -->
<html lang="ja">
  <!--日本語であることを宣言-->
  <head>
    <meta charset="UTF-8" />
    <!--文字コード指定-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--CSSファイル読み込み-->
    <style>
      :root {
        --bg1: #279f2f74;
        --bg2: #63b27b;
        --white: #ffffff;
        --glass: rgba(255, 255, 255, 0.16);
        --glass2: rgba(255, 255, 255, 0.22);
        --line: rgba(255, 255, 255, 0.28);
        --shadow: rgba(0, 0, 0, 0.22);

        --scale: 1.3; /* ★文字サイズ倍率 */
      }

      body {
        margin: 0;
        height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--white);
        background: radial-gradient(
            1200px 700px at 15% 10%,
            rgba(255, 255, 255, 0.35),
            rgba(255, 255, 255, 0) 60%
          ),
          radial-gradient(
            900px 600px at 85% 20%,
            rgba(255, 255, 255, 0.22),
            rgba(255, 255, 255, 0) 62%
          ),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        display: flex;
        text-shadow: 0 10px 30px var(--shadow);
      }

      h1 {
        margin-left: 30px;
        font-size: calc(46px * var(--scale));
        letter-spacing: 0.03em;
        text-shadow: 0 10px 30px var(--shadow);
      }

      #table {
        text-align: center;
        margin-left: auto;
        margin-right: auto;
        border-collapse: collapse;
      }

      #subjects {
        font-size: 200%;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <h1 id="page_name">時間割変更</h1>

      {%if main_timetable%}
      <table id="table">
        {%for timetable in main_timetable%}

        <tr>
          <td colspan="10" style="height: 20px"></td>
        </tr>

        <tr>
          <td>　</td>
          {% for time in range(4) %}
          <td>{{time+1}}コマ目</td>
          {%endfor%}
        </tr>

        <tr id="subjects">
          <td>{{timetable["date"]}}　　</td>
          {%for subject in timetable["subjects"]%}
          <td>{{subject["subject"]}}　</td>
          {%endfor%}
        </tr>

        {%endfor%}
      </table>

      {%else%}
      <p>本日より２週間以内の時間割変更はありません</p>
      {%endif%}
    </div>
  </body>
  <script src="{{url_for('static',filename='main.js')}}"></script>
</html>
