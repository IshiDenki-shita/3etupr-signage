<!DOCTYPE html>
<!-- HTML5であることを宣言 -->
<html lang="ja">
  <!--日本語であることを宣言-->
  <head>
    <meta charset="UTF-8" />
    <!--文字コード指定-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--CSSファイル読み込み-->
  </head>
  <body>
    <h1>1ページ目(時間割ページ)</h1>

    <p>時間割変更</p>
    <table>
      {%for day, subjects in timetable.items()%}
      <td>{{day}}</td>
      <tr>
        {%for time in range(4)%}
        <td>{{time+1}}</td>
        {%endfor%}
      </tr>
      <tr>
        {%for subject in subjects%}
        <td>{{subject}}　</td>
        {%endfor%}
      </tr>
      {%endfor%}
    </table>
  </body>
  <script src="{{url_for('static',filename='main.js')}}"></script>
</html>
