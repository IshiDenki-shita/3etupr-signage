<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- メタデータ設定 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>train</title>

  <!-- Google Fontsの読み込み (DotGothic16) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    /* * デザイン用変数の定義
     * LED掲示板風の配色とフォントを設定
     */
    :root {
      --bg-color: #000000;
      --text-orange: #FF8C00;
      --text-green: #00FF00;
      --text-red: #FF0000;
      --led-dim: rgba(255, 255, 255, 0.1);
      --font-family: 'DotGothic16', sans-serif;
    }

    /* 全体のレイアウト設定 */
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-orange);
      font-family: var(--font-family);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* スクロール禁止 */
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* LED色のユーティリティクラス */
    .led-green {
      color: var(--text-green);
    }

    .led-red {
      color: var(--text-red);
    }

    /* ヘッダーエリア（駅名と時計） */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 35px 40px;
      border-bottom: 6px solid var(--text-green);
      flex: 0 0 auto;
      background-color: #111;
    }

    h1 {
      margin: 0;
      font-size: 4rem;
      letter-spacing: 0.1em;
    }

    #clock-display {
      font-size: 6rem;
      font-weight: bold;
      line-height: 1;
      letter-spacing: 0.05em;
    }

    /* メインコンテンツエリア（3カラムグリッド） */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background-color: var(--text-green);
      /* グリッド線の色として機能 */
      padding-top: 4px;
    }

    /* 各方面のカラムスタイル */
    .destination-column {
      background-color: var(--bg-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .column-header {
      font-size: 4vw;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px dashed var(--text-orange);
      line-height: 1.1;
    }

    .english-title {
      display: block;
      font-size: 2rem;
      margin-top: 5px;
      opacity: 0.8;
    }

    .train-list {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 20px;
    }

    /* 個別列車情報の表示エリア */
    .train-item {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      padding-bottom: 40px;
      border-bottom: 2px dotted var(--led-dim);
      transition: opacity 0.3s;
    }

    /* 先発列車（一番上）のスタイル強調 */
    .train-item:first-child {
      margin-bottom: 60px;
      border-bottom: none;
    }

    /* 次発以降のスタイルの透明度調整 */
    .train-item:not(:first-child) {
      opacity: 0.75;
    }

    .train-item:not(:first-child) .departure-time {
      font-size: 4rem;
    }

    .train-item:first-child .departure-time {
      font-size: 9rem;
      color: var(--text-orange);
    }

    .train-info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .departure-time {
      line-height: 1;
      font-weight: bold;
    }

    .countdown-timer {
      text-align: right;
      font-size: 2.5rem;
      color: var(--text-green);
      font-weight: bold;
    }

    .train-item:first-child .countdown-timer {
      font-size: 5rem;
      line-height: 1.1;
      margin-top: 10px;
    }

    /* カウントダウンゲージのスタイル */
    .gauge-container {
      position: absolute;
      bottom: 0px;
      left: 0;
      width: 100%;
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }

    .gauge-container.show {
      display: block;
    }

    .gauge-bar {
      height: 100%;
      background-color: var(--text-green);
      width: 0%;
      transition: width 1s linear;
    }

    /* 特別なステータス表示（運転終了、データなし） */
    .operation-ended {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      color: var(--text-orange);
      text-align: center;
      border-bottom: none !important;
      margin-bottom: 0 !important;
    }

    .no-data {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      color: var(--text-red);
      text-align: center;
      border-bottom: none !important;
      margin-bottom: 0 !important;
    }

    /* 免責事項フッター */
    .disclaimer-footer {
      position: absolute;
      bottom: 0;
      right: 0;
      height: 30px;
      line-height: 30px;
      padding-right: 15px;
      padding-left: 15px;
      color: #888;
      font-size: 14px;
      text-align: right;
      background-color: var(--bg-color);
      z-index: 100;
      white-space: nowrap;
    }

    /* レスポンシブ対応（画面幅1200px以下） */
    @media (max-width: 1200px) {
      h1 {
        font-size: 2.5rem;
      }

      #clock-display {
        font-size: 4rem;
      }

      .train-item:first-child .departure-time {
        font-size: 6rem;
      }

      .train-item:first-child .countdown-timer {
        font-size: 3.5rem;
      }

      .train-item:not(:first-child) .departure-time {
        font-size: 3rem;
      }

      .column-header {
        font-size: 3rem;
      }

      header {
        padding: 20px 20px;
      }

      .disclaimer-footer {
        font-size: 10px;
      }

      .operation-ended,
      .no-data {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <!-- ヘッダーエリア -->
  <header>
    <h1 class="led-green">津幡駅 時刻表</h1>
    <div id="clock-display" class="led-text">--:--:--</div>
  </header>

  <!-- メインコンテンツ -->
  <main>
    <!-- 金沢方面 -->
    <section class="destination-column">
      <div class="column-header led-green">
        金沢 <span class="english-title">Kanazawa</span>
      </div>
      <ul class="train-list" id="list-kanazawa"></ul>
    </section>
    <!-- 七尾方面 -->
    <section class="destination-column">
      <div class="column-header led-green">
        七尾 <span class="english-title">Nanao</span>
      </div>
      <ul class="train-list" id="list-nanao"></ul>
    </section>
    <!-- 富山方面 -->
    <section class="destination-column">
      <div class="column-header led-green">
        富山 <span class="english-title">Toyama</span>
      </div>
      <ul class="train-list" id="list-toyama"></ul>
    </section>
  </main>

  <!-- フッター -->
  <div class="disclaimer-footer">
    表示時刻は実際の運行情報を反映するものではありません。本表示内容によって生じたいかなる損害についても、開発者は一切の責任を負いません。
  </div>

  <!-- 外部JSファイルの読み込み -->
  <script src="{{url_for('static',filename='main.js')}}"></script>
  <script>
    // Flaskから渡されたデータを初期化
    let trainData = {{ train_data | tojson }};

    // 定数設定
    const GAUGE_MAX_SECONDS = 20 * 60; // ゲージ表示を開始する残り秒数
    const padZero = (num) => num.toString().padStart(2, '0'); // ゼロ埋めヘルパー関数

    /**
     * 時計更新および定期実行処理
     * 1秒ごとに呼び出される
     */
    function updateClock() {
      const now = new Date();
      const timeString = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;

      // 時計表示の更新
      const clockEl = document.getElementById('clock-display');
      if (clockEl.innerText !== timeString) {
        clockEl.innerText = timeString;
      }

      // カウントダウン表示の更新
      updateCountdowns(now);
    }

    /**
     * DOM要素生成: 通常の列車情報
     */
    function createTrainElement() {
      const li = document.createElement('li');
      li.className = 'train-item';
      li.innerHTML = `
                <div class="train-info-row">
                    <span class="departure-time led-text"></span>
                </div>
                <div class="countdown-timer"></div>
                <div class="gauge-container">
                    <div class="gauge-bar"></div>
                </div>
            `;
      return li;
    }

    /**
     * DOM要素生成: 運転終了メッセージ
     */
    function createOperationEndedElement() {
      const li = document.createElement('li');
      li.className = 'train-item operation-ended';
      li.innerText = "運転終了";
      return li;
    }

    /**
     * DOM要素生成: データなしメッセージ
     */
    function createNoDataElement() {
      const li = document.createElement('li');
      li.className = 'train-item no-data';
      li.innerText = "データなし";
      return li;
    }

    /**
     * カウントダウンおよび列車情報の更新ロジック
     * @param {Date} now 現在時刻
     */
    function updateCountdowns(now) {
      let needsReload = false;
      const nowTime = now.getTime();

      // 各方面（金沢、七尾、富山）についてループ処理
      ['kanazawa', 'nanao', 'toyama'].forEach(dir => {
        const listEl = document.getElementById(`list-${dir}`);

        // データが存在しない場合の処理
        if (!trainData || !trainData.destination) {
          if (!listEl.querySelector('.no-data')) {
            listEl.innerHTML = '';
            listEl.appendChild(createNoDataElement());
          }
          return;
        }

        const trains = trainData.destination[dir] || [];

        // 運行予定がない（または終了した）場合の処理
        if (trains.length === 0) {
          if (!listEl.querySelector('.operation-ended')) {
            listEl.innerHTML = '';
            listEl.appendChild(createOperationEndedElement());
          }
          return;
        }

        // 通常表示の準備（メッセージ要素があれば削除）
        if (listEl.querySelector('.operation-ended') || listEl.querySelector('.no-data')) {
          listEl.innerHTML = '';
        }

        // DOM要素の数をデータ数に合わせる（再利用によるパフォーマンス最適化）
        const children = listEl.children;
        while (children.length < trains.length) {
          listEl.appendChild(createTrainElement());
        }
        while (children.length > trains.length) {
          listEl.removeChild(listEl.lastChild);
        }

        // 各列車のデータをDOMに反映
        trains.forEach((train, index) => {
          const li = children[index];

          // 発車日時の計算
          const trainDate = new Date();
          trainDate.setHours(train.hour);
          trainDate.setMinutes(train.minute);
          trainDate.setSeconds(0);

          // 日付をまたぐ場合の処理
          if (train.is_next_day) {
            trainDate.setDate(trainDate.getDate() + 1);
          } else {
            // 現在時刻より12時間以上前の時刻の場合は翌日扱いとする安全策
            if (trainDate.getTime() < nowTime - 12 * 60 * 60 * 1000) {
              trainDate.setDate(trainDate.getDate() + 1);
            }
          }

          const diff = trainDate - now;
          const diffSeconds = diff / 1000;

          // 表示テキストとスタイルの決定
          let timeText = `${padZero(train.hour)}:${padZero(train.minute)}`;
          let countdownText = "";
          let gaugeWidth = 0;
          let showGauge = false;
          let statusClass = "led-green";

          if (diff > 0) {
            // 発車前: カウントダウン表示
            const diffMin = Math.floor(diff / 60000);
            const diffSec = Math.floor((diff % 60000) / 1000);
            countdownText = `あと ${diffMin}分${padZero(diffSec)}秒`;

            // 指定時間以内ならゲージを表示
            if (diffSeconds <= GAUGE_MAX_SECONDS) {
              showGauge = true;
              gaugeWidth = (diffSeconds / GAUGE_MAX_SECONDS) * 100;
            }
          } else {
            // 発車後
            if (diff > -5000) {
              // 発車後5秒間はメッセージを表示
              countdownText = "発車しました";
              statusClass = "led-red";
            } else {
              // 5秒経過後、次の列車を表示するためにリロードフラグを立てる
              needsReload = true;
              li.style.display = 'none'; // 一時的に非表示
              return;
            }
          }

          li.style.display = '';

          // DOM更新（変更がある場合のみ）
          const timeEl = li.querySelector('.departure-time');
          if (timeEl.innerText !== timeText) timeEl.innerText = timeText;

          const countEl = li.querySelector('.countdown-timer');
          if (countEl.innerText !== countdownText) countEl.innerText = countdownText;

          countEl.classList.remove('led-green', 'led-red');
          countEl.classList.add(statusClass);

          const gaugeContainer = li.querySelector('.gauge-container');
          const gaugeBar = li.querySelector('.gauge-bar');

          if (showGauge) {
            gaugeContainer.classList.add('show');
            gaugeBar.style.width = `${gaugeWidth}%`;
          } else {
            gaugeContainer.classList.remove('show');
          }
        });
      });

      // データの更新が必要になった場合（列車が発車して画面から消えた後など）
      if (needsReload) {
        location.reload();
      }
    }

    // 初期化処理
    window.onload = function () {
      updateClock();
      setInterval(updateClock, 1000); // 1秒ごとに更新
    };
  </script>
</body>

</html>
