<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>train</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --text-orange: #FF8C00;
      --text-green: #00FF00;
      --text-red: #FF0000;
      --led-dim: rgba(255, 255, 255, 0.1);
      --font-family: 'DotGothic16', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-orange);
      font-family: var(--font-family);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .led-green {
      color: var(--text-green);
    }

    .led-red {
      color: var(--text-red);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 35px 40px;
      border-bottom: 6px solid var(--text-green);
      flex: 0 0 auto;
      background-color: #111;
    }

    h1 {
      margin: 0;
      font-size: 4rem;
      letter-spacing: 0.1em;
    }

    #clock-display {
      font-size: 6rem;
      font-weight: bold;
      line-height: 1;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background-color: var(--text-green);
      padding-top: 4px;
    }

    .destination-column {
      background-color: var(--bg-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .column-header {
      font-size: 4vw;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px dashed var(--text-orange);
      line-height: 1.1;
    }

    .english-title {
      display: block;
      font-size: 2rem;
      margin-top: 5px;
      opacity: 0.8;
    }

    .train-list {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 20px;
    }

    .train-item {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      padding-bottom: 40px;
      border-bottom: 2px dotted var(--led-dim);
      transition: opacity 0.3s;
    }

    .train-item:first-child {
      margin-bottom: 60px;
      border-bottom: none;
    }

    .train-item:not(:first-child) {
      opacity: 0.75;
    }

    .train-item:not(:first-child) .departure-time {
      font-size: 4rem;
    }

    .train-item:first-child .departure-time {
      font-size: 9rem;
      color: var(--text-orange);
    }

    .train-info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .departure-time {
      line-height: 1;
      font-weight: bold;
    }

    .countdown-timer {
      text-align: right;
      font-size: 2.5rem;
      color: var(--text-green);
      font-weight: bold;
    }

    .train-item:first-child .countdown-timer {
      font-size: 5rem;
      line-height: 1.1;
      margin-top: 10px;
    }

    .gauge-container {
      position: absolute;
      bottom: 0px;
      left: 0;
      width: 100%;
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
      /* 非表示時は見えなくする */
      display: none;
    }

    /* 表示用クラス */
    .gauge-container.show {
      display: block;
    }

    .gauge-bar {
      height: 100%;
      background-color: var(--text-green);
      width: 0%;
      transition: width 1s linear;
    }

    .operation-ended {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      color: var(--text-orange);
      text-align: center;
      border-bottom: none !important;
      margin-bottom: 0 !important;
    }

    .disclaimer-footer {
      position: absolute;
      bottom: 0;
      right: 0;
      height: 30px;
      line-height: 30px;
      padding-right: 15px;
      padding-left: 15px;
      color: #888;
      font-size: 14px;
      text-align: right;
      background-color: var(--bg-color);
      z-index: 100;
      white-space: nowrap;
    }

    @media (max-width: 1200px) {
      h1 {
        font-size: 2.5rem;
      }

      #clock-display {
        font-size: 4rem;
      }

      .train-item:first-child .departure-time {
        font-size: 6rem;
      }

      .train-item:first-child .countdown-timer {
        font-size: 3.5rem;
      }

      .train-item:not(:first-child) .departure-time {
        font-size: 3rem;
      }

      .column-header {
        font-size: 3rem;
      }

      header {
        padding: 20px 20px;
      }

      .disclaimer-footer {
        font-size: 10px;
      }

      .operation-ended {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1 class="led-green">津幡駅 時刻表</h1>
    <div id="clock-display" class="led-text">--:--:--</div>
  </header>

  <main>
    <!-- 金沢方面 -->
    <section class="destination-column">
      <div class="column-header led-green">
        金沢 <span class="english-title">Kanazawa</span>
      </div>
      <ul class="train-list" id="list-kanazawa"></ul>
    </section>

    <!-- 七尾方面 -->
    <section class="destination-column">
      <div class="column-header led-green">
        七尾 <span class="english-title">Nanao</span>
      </div>
      <ul class="train-list" id="list-nanao"></ul>
    </section>

    <!-- 富山方面 -->
    <section class="destination-column">
      <div class="column-header led-green">
        富山 <span class="english-title">Toyama</span>
      </div>
      <ul class="train-list" id="list-toyama"></ul>
    </section>
  </main>

  <div class="disclaimer-footer">
    表示時刻は実際の運行情報を反映するものではありません。本表示内容によって生じたいかなる損害についても、開発者は一切の責任を負いません。
  </div>

  <script>
    // --- 初期設定 ---
    // Flaskテンプレートから初期データを安全に受け取る（破損時は空オブジェクト）
    let trainData = {{ train_data | tojson }} || { destination: {} };
    let isFetching = false;

    // ゲージの最大秒数
    const GAUGE_MAX_SECONDS = 20 * 60;

    // ゼロ埋めヘルパー
    const padZero = (num) => num.toString().padStart(2, '0');

    /**
     * 時計の更新とカウントダウン処理のトリガー
     * 毎秒実行されるため、軽量に保つ
     */
    function updateClock() {
      const now = new Date();

      // 時計表示の更新
      const timeString = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
      const clockEl = document.getElementById('clock-display');
      if (clockEl.innerText !== timeString) {
        clockEl.innerText = timeString;
      }

      // 長期運用のための定期リロード (メモリリーク防止のため毎日AM4時にリセット)
      if (now.getHours() === 4 && now.getMinutes() === 0 && now.getSeconds() === 0) {
        location.reload();
      }

      updateCountdowns(now);
    }

    /**
     * データの非同期取得
     * 直近の列車が発車した後に呼ばれる
     */
    async function fetchData() {
      if (isFetching) return;
      isFetching = true;
      // console.log("Fetching new data..."); // デバッグログはコメントアウト

      try {
        const response = await fetch('/api/data');
        if (response.ok) {
          const newData = await response.json();
          if (newData && newData.destination) {
            trainData = newData;
            // データ更新後即座に画面反映
            updateCountdowns(new Date());
          }
        }
      } catch (e) {
        console.error("Fetch Error:", e);
      } finally {
        isFetching = false;
      }
    }

    /**
     * DOM要素を生成する（初回または構造変更時のみ使用）
     */
    function createTrainElement() {
      const li = document.createElement('li');
      li.className = 'train-item';
      li.innerHTML = `
                <div class="train-info-row">
                    <span class="departure-time led-text"></span>
                </div>
                <div class="countdown-timer"></div>
                <div class="gauge-container">
                    <div class="gauge-bar"></div>
                </div>
            `;
      return li;
    }

    function createOperationEndedElement() {
      const li = document.createElement('li');
      li.className = 'train-item operation-ended';
      li.innerText = "運転終了";
      return li;
    }

    /**
     * カウントダウン表示の更新
     * DOMの再生成を避け、既存要素のプロパティ更新を行うことで描画負荷を下げる
     */
    function updateCountdowns(now) {
      let needsReload = false;
      const nowTime = now.getTime();

      ['kanazawa', 'nanao', 'toyama'].forEach(dir => {
        const listEl = document.getElementById(`list-${dir}`);
        const trains = trainData.destination[dir] || [];

        // --- ケース1: 運転終了 ---
        if (trains.length === 0) {
          // 現在の内容が「運転終了」でなければ置き換える
          if (!listEl.querySelector('.operation-ended')) {
            listEl.innerHTML = '';
            listEl.appendChild(createOperationEndedElement());
          }
          return;
        }

        // 「運転終了」表示からの復帰時はリストをクリア
        if (listEl.querySelector('.operation-ended')) {
          listEl.innerHTML = '';
        }

        // --- DOM要素数の調整 ---
        const children = listEl.children;
        // 足りない要素を追加
        while (children.length < trains.length) {
          listEl.appendChild(createTrainElement());
        }
        // 余分な要素を削除
        while (children.length > trains.length) {
          listEl.removeChild(listEl.lastChild);
        }

        // --- 各列車の表示更新 ---
        trains.forEach((train, index) => {
          const li = children[index];

          // 発車時刻オブジェクトの生成
          const trainDate = new Date();
          trainDate.setHours(train.hour);
          trainDate.setMinutes(train.minute);
          trainDate.setSeconds(0);

          // 日付またぎの調整
          if (train.is_next_day) {
            trainDate.setDate(trainDate.getDate() + 1);
          } else {
            // 補正: 12時間以上過去の場合は翌日とみなすロジック（バックエンドとの整合性用）
            if (trainDate.getTime() < nowTime - 12 * 60 * 60 * 1000) {
              trainDate.setDate(trainDate.getDate() + 1);
            }
          }

          const diff = trainDate - now;
          const diffSeconds = diff / 1000;

          // 表示内容の計算
          let timeText = `${padZero(train.hour)}:${padZero(train.minute)}`;
          let countdownText = "";
          let gaugeWidth = 0;
          let showGauge = false;
          let statusClass = "led-green";
          let isDeparted = false;

          if (diff > 0) {
            // 発車前
            const diffMin = Math.floor(diff / 60000);
            const diffSec = Math.floor((diff % 60000) / 1000);
            countdownText = `あと ${diffMin}分${padZero(diffSec)}秒`;

            if (diffSeconds <= GAUGE_MAX_SECONDS) {
              showGauge = true;
              gaugeWidth = (diffSeconds / GAUGE_MAX_SECONDS) * 100;
            }
          } else {
            // 発車後
            if (diff > -5000) {
              countdownText = "発車しました";
              statusClass = "led-red";
              isDeparted = true;
            } else {
              // 5秒経過したらデータ更新フラグを立てる（次の列車を表示するため）
              needsReload = true;
              // 暫定非表示
              li.style.display = 'none';
              return;
            }
          }

          li.style.display = ''; // 表示状態を確実にリセット

          // --- DOMへの反映（変更がある場合のみ代入することでLayout Thrashingを防ぐ）---
          const timeEl = li.querySelector('.departure-time');
          if (timeEl.innerText !== timeText) timeEl.innerText = timeText;

          const countEl = li.querySelector('.countdown-timer');
          if (countEl.innerText !== countdownText) countEl.innerText = countdownText;

          // クラスの更新（led-green / led-red）
          countEl.classList.remove('led-green', 'led-red');
          countEl.classList.add(statusClass);

          // ゲージの更新
          const gaugeContainer = li.querySelector('.gauge-container');
          const gaugeBar = li.querySelector('.gauge-bar');

          if (showGauge) {
            gaugeContainer.classList.add('show');
            gaugeBar.style.width = `${gaugeWidth}%`;
          } else {
            gaugeContainer.classList.remove('show');
          }
        });
      });

      if (needsReload) {
        fetchData();
      }
    }

    // --- 初期化実行 ---
    window.onload = function () {
      updateClock();
      setInterval(updateClock, 1000);
    };
  </script>
</body>

</html>
